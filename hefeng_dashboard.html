  .stats-header { background:#1e40af; color:white; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }

  /* 訂單總覽 modal */

<body>

<div class="top"><h1>📦 合豐行 — 訂單儀表板</h1></div>
<div class="container" id="app"></div>

<!-- 編輯訂單 Modal -->
<div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEditOrder()">
  <div class="edit-box">

let pwd = sessionStorage.getItem('hefeng_dashboard_pwd') || '';

function renderLogin(errMsg) {
  document.getElementById('app').innerHTML =
    '<div class="login-box">' +
      '<div style="font-size:16px;font-weight:600;color:#1e40af;">請輸入儀表板密碼</div>' +
      '<input type="password" id="pwdInput" maxlength="12" placeholder="密碼" />' +
      '<button onclick="tryLogin()">登入</button>' +
      (errMsg ? '<div class="err">' + errMsg + '</div>' : '') +
    '</div>';
  document.getElementById('pwdInput').focus();
  document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key==='Enter') tryLogin(); });
}

function tryLogin() {
  pwd = document.getElementById('pwdInput').value;
  loadDashboard();
}

function todayStr() {
  const d = new Date();
  d.setDate(d.getDate() + 1); // 預設顯示隔天（送貨日）
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadDashboard(dateOverride) {
  const date = dateOverride || todayStr();
  fetch(V2_GAS_URL + '?action=dashboard&date=' + encodeURIComponent(date) + '&pwd=' + encodeURIComponent(pwd))
    .then(r => r.json())
    .then(data => {
      if (data.error === 'unauthorized') { renderLogin('密碼錯誤，請再試一次'); return; }
      sessionStorage.setItem('hefeng_dashboard_pwd', pwd);
      renderOrders(data.orders || [], date);
    })
    .catch(() => renderLogin('連線失敗，請檢查網路後再試一次'));
}

let selectedIds = new Set();

function renderOrders(orders, date) {
  currentOrders = orders;
  selectedIds.clear();
  let html = '<div class="toolbar">' +
    '<input type="date" id="dateInput" value="' + date + '" onchange="loadDashboard(this.value)">' +
    '<button onclick="loadDashboard(document.getElementById(\'dateInput\').value)">重新整理</button>' +
    '<div class="toolbar-menu-wrap">' +
      '<button class="toolbar-menu-btn" onclick="toggleToolbarMenu(event)" title="功能選單">☰</button>' +
      '<div class="toolbar-dropdown" id="toolbarDropdown">' +
        '<button onclick="closeToolbarMenu();showStats()">📊 品項統計</button>' +
        '<button onclick="closeToolbarMenu();exportExcel(event)">📥 匯出Excel</button>' +
        '<button onclick="closeToolbarMenu();showOverview()">📅 各日總覽</button>' +
        '<button onclick="closeToolbarMenu();openPList()">📋 品項總覽</button>' +
        '<button onclick="closeToolbarMenu();openPMgmt()">🥬 品項管理</button>' +
        '<button class="menu-danger" onclick="closeToolbarMenu();showDeleteDay()">🗑️ 刪除當天全部</button>' +
        '<button onclick="closeToolbarMenu();showChangePwd()">🔑 修改密碼</button>' +
      '</div>' +
    '</div>' +
    '</div>';

  const activeOrders   = orders.filter(o => o.status !== 'cancelled');
  const cancelledCount = orders.length - activeOrders.length;

  // 摘要卡片
  html += '<div class="summary-bar">' +
    '<div class="summary-card"><div class="num">' + activeOrders.length + '</div><div class="label">📦 已下單客戶</div></div>' +
    '<div class="summary-card"><div class="num" style="color:#c0392b;">' + cancelledCount + '</div><div class="label">❌ 已取消</div></div>' +
    '<div class="summary-card"><div class="num" style="color:#888;">' + orders.length + '</div><div class="label">🗂️ 訂單總筆數</div></div>' +
  '</div>';

  if (!activeOrders.length && !cancelledCount) {
    html += '<div class="empty">這天目前還沒有訂單</div>';
    document.getElementById('app').innerHTML = html;
    return;
  }

  html += '<div class="batch-bar" id="batchBar" style="display:none;">' +
    '<span id="batchCount">已選取 0 筆</span>' +
    '<span>' +
      '<button style="background:#555;margin-right:8px;" onclick="clearSelection()">取消選取</button>' +
      '<button onclick="deleteBatch()">🗑️ 刪除已選取</button>' +
    '</span>' +
  '</div>';

  orders.sort((a,b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  orders.forEach((o, idx) => {
    const badge = o.status === 'cancelled'
      ? '<span class="badge badge-cancelled">❌ 已取消</span>'
      : (o.changeCount > 1 ? '<span class="badge badge-modified">✏️ 已修改 ' + (o.changeCount-1) + ' 次</span>' : '<span class="badge badge-new">🆕 新單</span>');

    html += '<div class="order-card">' +
      '<div class="order-head" onclick="toggleItems(' + idx + ')">' +
        '<input type="checkbox" class="order-check" onclick="event.stopPropagation();toggleSelect(\'' + o.orderId + '\')">' +
        '<div style="flex:1;"><div class="customer-name">' + escapeHtml(o.customer) + (o.customerAlias ? '<span class="alias-tag">別稱：' + escapeHtml(o.customerAlias) + '</span>' : '') + '</div>' +
        '<div class="meta">建立 ' + o.createdAt + (o.updatedAt !== o.createdAt ? '　最後修改 ' + o.updatedAt : '') + '</div>' +
        (o.printedPrices && o.printedPrices.total > 0 ? '<div class="meta" style="color:#166534;font-weight:600;">💵 批價合計：$' + o.printedPrices.total + '　<span style="font-weight:400;">' + (o.printedPrices.printedAt||'') + '</span></div>' : '') +
        '</div>' +
        badge +
      '</div>' +
      '<div class="items" id="items' + idx + '">' +
        o.items.map(it => '<div>• ' + escapeHtml(it.name) + '　' + it.qty + (it.unit||'') + (it.note ? '（'+escapeHtml(it.note)+'）' : '') + '</div>').join('') +
        (o.logs && o.logs.length ? '<div style="margin-top:8px;border-top:1px dashed #e0e0e0;padding-top:6px;">' +
          o.logs.map(l => '<div class="log-line">' + l.time + '　' + l.detail + '</div>').join('') + '</div>' : '') +
        '<div style="display:flex;gap:8px;margin-top:6px;">' +
          '<button class="delete-btn" style="flex:1;background:#f0fdf4;color:#166534;border-color:#86efac;margin-top:0;" onclick="event.stopPropagation();showPrint(' + idx + ')">🖨️ 列印送貨單</button>' +
          '<button class="delete-btn" style="flex:0 0 auto;width:auto;padding:8px 16px;background:#e8f0fe;color:#1e40af;border-color:#93c5fd;margin-top:0;" onclick="event.stopPropagation();showBatchPriceFromCard(' + idx + ')">💰 批價</button>' +
          '<button class="delete-btn" style="flex:0 0 auto;width:auto;padding:8px 16px;background:#f5f3ff;color:#7c3aed;border-color:#c4b5fd;margin-top:0;" onclick="event.stopPropagation();openEditOrder(' + idx + ')">✏️ 編輯</button>' +
        '</div>' +
        '<button class="delete-btn" onclick="event.stopPropagation();deleteOrder(\'' + o.orderId + '\',\'' + escapeHtml(o.customer).replace(/'/g,"\\'") + '\')">🗑️ 刪除這筆訂單（測試用，正式資料請用「取消」）</button>' +
      '</div>' +
    '</div>';
  });

  document.getElementById('app').innerHTML = html;
}

function exportExcel(event) {
  const date = document.getElementById('dateInput').value;
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = '匯出中...（可能要等 10-30 秒）';

  fetch(V2_GAS_URL + '?action=exportExcel&date=' + encodeURIComponent(date) + '&pwd=' + encodeURIComponent(pwd))
    .then(r => r.json())
    .then(result => {
      btn.disabled = false; btn.textContent = originalText;
      if (result.error) { alert('匯出失敗：' + result.error); return; }
      const byteChars = atob(result.base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = result.filename; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    })
    .catch(() => { btn.disabled = false; btn.textContent = originalText; alert('匯出失敗，請檢查網路後再試一次。'); });
}

// ★ 自動偵測橋接器 URL
// 從 PrintBridge 本機開啟（http://）→ 用同一台機器的 /print（不需掃描）
// 從 GitHub Pages（https://）→ 先用記憶的 IP，沒有則掃描常見網段

async function probeIp(ip) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 1500);
  try {
    const r = await fetch('http://' + ip + ':9100/status', { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('not ok');
    return ip;
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

async function autoDiscoverBridge() {
  // 同時掃多個常見網段：
  //   172.20.10.x  → iPhone 個人熱點固定段（.2~.15）
  //   192.168.1.x  → 一般家用/辦公室路由器
  //   192.168.0.x  → 另一種常見家用路由器
  const candidates = [
    ...Array.from({length: 14}, (_, i) => '172.20.10.' + (i + 2)),
    ...Array.from({length: 50}, (_, i) => '192.168.1.' + (i + 1)),
    ...Array.from({length: 50}, (_, i) => '192.168.0.' + (i + 1)),
  ];
  const found = await Promise.any(candidates.map(ip => probeIp(ip))).catch(() => null);
  return found;
}

async function autoFillBridgeUrl() {
  const input = document.getElementById('bridgeUrl');
  // 從 PrintBridge 本機開啟：直接用同一台機器
  if (window.location.protocol === 'http:') {
    input.value = window.location.origin + '/print';
    return;
  }
  // GitHub Pages：先試記憶的 IP
  try {
    const stored = localStorage.getItem('hefeng_bridgeUrl');
    if (stored) { input.value = stored; return; }
  } catch(e) {}
  // 沒有記憶：自動掃描
  input.value = '';
  input.placeholder = '🔍 自動掃描中...';
  const ip = await autoDiscoverBridge();
  if (ip) {
    const url = 'http://' + ip + ':9100/print';
    input.value = url;
    input.placeholder = '自動偵測';
    try { localStorage.setItem('hefeng_bridgeUrl', url); } catch(e) {}
  } else {
    input.placeholder = '找不到印表機，請手動輸入 IP';
  }
}

  printOrderIdx = idx;
  autoFillBridgeUrl();
  try {

  } catch(e) {}

  // ★ 直接用該筆訂單已存的批價填入（無需 async，不會跨單污染）
  let rows = '';
  (o.items || []).forEach((it, i) => {
    const saved = getOrderPrice(idx, it.name || '');
    rows += '<tr>' +
      '<td>' + escapeHtml(it.name||'') + '</td>' +

      '<td id="sub_' + i + '">—</td>' +
    '</tr>';
  });
  document.getElementById('printItems').innerHTML = rows;

function calcPrintTotal() {
  const o = currentOrders[printOrderIdx];
  let total = 0;
  (o.items || []).forEach((it, i) => {
    const price = parseFloat(document.getElementById('price_' + i).value) || 0;
    const qty = Number(it.qty) || 0;
    const sub = price * qty;
    total += sub;
    document.getElementById('sub_' + i).textContent = price ? '$' + sub : '—';
  });
  document.getElementById('printTotal').textContent = '總計：$' + total;
}

// ── 列印欄位對齊工具（考慮中文佔 2 格）──
function _clen(s) {
  return [...String(s||'')].reduce((a,c) => a + (c.charCodeAt(0) > 127 ? 2 : 1), 0);
}
function padR(s, n) { s = String(s||''); return s + ' '.repeat(Math.max(0, n - _clen(s))); }
function padL(s, n) { s = String(s||''); return ' '.repeat(Math.max(0, n - _clen(s))) + s; }

// ── Big5 編碼器（使用瀏覽器內建 TextDecoder 建立反查表）──
// 原理：TextDecoder 支援 Big5 解碼，利用它逐一解碼所有 Big5 雙位元組組合，
// 建立「Unicode 字元 → Big5 雙位元組」的反查表，再用來把印表機字串轉成 Big5。
var _big5Table = null;
function _getBig5Table() {
  if (_big5Table) return _big5Table;
  _big5Table = {};
  var dec = new TextDecoder('big5', { fatal: false });
  // Big5 高位元組：0xA1–0xF9，低位元組：0x40–0x7E 和 0xA1–0xFE
  for (var hi = 0xA1; hi <= 0xF9; hi++) {
    for (var lo = 0x40; lo <= 0xFE; lo++) {
      if (lo >= 0x7F && lo <= 0xA0) continue;  // 無效區間
      var bytes = new Uint8Array([hi, lo]);
      var ch = dec.decode(bytes);
      // 只收錄非 ASCII、且非替換字元的有效字元
      if (ch && ch.length === 1 && ch.charCodeAt(0) > 127 && ch !== '�') {
        _big5Table[ch] = (hi << 8) | lo;
      }
    }
  }
  return _big5Table;
}
function _encodeBig5(str) {
  var table = _getBig5Table();
  var buf = [];
  for (var i = 0; i < str.length; i++) {
    var c = str[i];
    var code = c.charCodeAt(0);
    if (code < 0x80) {
      buf.push(code);               // ASCII / ESC-POS 控制字元直接輸出
    } else {
      var b5 = table[c];
      if (b5) {
        buf.push((b5 >> 8) & 0xFF); // Big5 高位元組
        buf.push(b5 & 0xFF);        // Big5 低位元組
      } else {
        buf.push(0x3F);             // 無法對應時輸出 '?'
      }
    }
  }
  return new Uint8Array(buf);
}

// ── 螢幕預覽（不列印）──
function _esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showReceiptPreview() {
  const o = currentOrders[printOrderIdx];
  const handler = (document.getElementById('printHandler').value || '').trim();
  const ITEMS_PER_PAGE    = 13;
  const PAPER_TARGET_MM   = 143;   // v2.4校正
  const C_MM              = 3.87;  // v2.4重新校正（v2.3實測）
  const T_MM              = 3.61;  // v2.4重新校正
  const FIXED_LINES       = 13;
  const SEP40 = '----------------------------------------';

  const items = o.items || [];
  const numPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));

  let total = 0;
  const prices = items.map((it, i) => {
    const priceEl = document.getElementById('price_' + i);
    const price = parseFloat(priceEl ? priceEl.value : 0) || 0;
    total += price * (Number(it.qty) || 0);
    return price;
  });

  let pagesHtml = '';
  for (let page = 0; page < numPages; page++) {
    const startIdx    = page * ITEMS_PER_PAGE;
    const endIdx      = Math.min(startIdx + ITEMS_PER_PAGE, items.length);
    const pageItemCnt = endIdx - startIdx;
    const isLast      = page === numPages - 1;
    const pageTag     = numPages > 1 ? '(' + (page+1) + '/' + numPages + ')' : '';

    let lines = [];
    const pad = function(s,n,right){
      var w = 0;
      for(var k=0;k<s.length;k++) w += s.charCodeAt(k)>127?2:1;
      var sp = Math.max(0, n - w);
      return right ? s + ' '.repeat(sp) : ' '.repeat(sp) + s;
    };

    // 標題9行（含3行間距）
    var title = '合豐行' + pageTag;
    var titlePad = Math.max(0, Math.floor((40 - (title.length*2)) / 2));
    lines.push('<b>' + _esc(' '.repeat(titlePad) + title) + '</b>');    // 行1
    lines.push('<span style="color:#ccc">·</span>');                     // 行2 [間距]
    lines.push(_esc('出貨日期：' + (o.deliveryDate || '')));             // 行3
    lines.push(_esc('客戶：' + (o.customer || '')));                     // 行4
    lines.push('<span style="color:#ccc">·</span>');                     // 行5 [間距]
    lines.push('<span style="color:#999">' + _esc(SEP40) + '</span>');  // 行6
    lines.push('<b>' + _esc(pad('品名',20,true) + pad('數量',6,false) + pad('單價',7,false) + pad('小計',7,false)) + '</b>');  // 行7
    lines.push('<span style="color:#ccc">·</span>');                     // 行8 [間距]
    lines.push('<span style="color:#999">' + _esc(SEP40) + '</span>');  // 行9

    // 品項（單行）
    for (var i = startIdx; i < endIdx; i++) {
      var it = items[i];
      var price = prices[i];
      var qty = Number(it.qty) || 0;
      var sub = price * qty;
      var qtyStr = qty + (it.unit || '');
      lines.push(_esc(pad(it.name||'',20,true) + pad(qtyStr,6,false) + pad(String(price),7,false) + pad(String(sub),7,false)));
    }

    // 底部4行（含2行間距）
    lines.push('<span style="color:#999">' + _esc(SEP40) + '</span>');  // 頁尾行1
    if (isLast) {
      var left = '經手人：' + handler;
      var right = '合計：$' + total;
      var lw = 0; for(var c=0;c<left.length;c++) lw+=left.charCodeAt(c)>127?2:1;
      var rw = 0; for(var c=0;c<right.length;c++) rw+=right.charCodeAt(c)>127?2:1;
      var gap = Math.max(1, 40 - lw - rw);
      lines.push('<b>' + _esc(left + ' '.repeat(gap) + right) + '</b>');  // 頁尾行2
    } else {
      lines.push('<span style="text-align:center;display:block">' + _esc('--- 請翻至下一張 ---') + '</span>');  // 頁尾行2
    }
    lines.push('<span style="color:#ccc">·</span>');  // 頁尾行3 [間距]
    lines.push('<span style="color:#ccc">·</span>');  // 頁尾行4 [間距]

    const contentLines = FIXED_LINES + pageItemCnt;
    const trailLines   = Math.max(1, Math.round((PAPER_TARGET_MM - contentLines * C_MM) / T_MM));
    const contentMM    = Math.round(contentLines * C_MM);
    const totalMM      = Math.round(contentMM + trailLines * T_MM);
    const fillPct      = Math.round(contentMM / PAPER_TARGET_MM * 100);

    if (numPages > 1) {
      pagesHtml += '<div style="font-weight:600;color:#1e40af;margin-bottom:6px;">第 ' + (page+1) + ' 張 / 共 ' + numPages + ' 張</div>';
    }
    pagesHtml += '<div class="preview-paper">' + lines.join('\n') + '</div>';
    pagesHtml += '<div class="preview-trail">▓ 空白走紙 ' + trailLines + ' LF × ' + T_MM + 'mm = ' + Math.round(trailLines*T_MM) + 'mm</div>';
    pagesHtml += '<div class="preview-stat">內容 ' + contentMM + 'mm（' + fillPct + '%）+ 走紙 ' + Math.round(trailLines*T_MM) + 'mm ≈ ' + totalMM + 'mm</div>';
  }

  var modal = document.createElement('div');
  modal.className = 'preview-overlay';
  modal.id = 'previewOverlay';
  modal.onclick = function(e){ if(e.target===modal) closeReceiptPreview(); };
  modal.innerHTML =
    '<div class="preview-box">' +
      '<div class="preview-header">' +
        '<h3>📄 螢幕預覽（不會列印）</h3>' +
        '<button class="preview-close" onclick="closeReceiptPreview()">×</button>' +
      '</div>' +
      pagesHtml +
    '</div>';
  document.body.appendChild(modal);
}

function closeReceiptPreview() {
  var el = document.getElementById('previewOverlay');
  if (el) el.remove();
}

function sendPrint() {
  const o = currentOrders[printOrderIdx];
  const bridgeUrl = document.getElementById('bridgeUrl').value.trim();
  const handler = (document.getElementById('printHandler').value || '').trim();

  const ESC = '\x1b', GS = '\x1d', LF = '\n';
  const INDENT   = '  ';          // 左縮排 2 格（≈1個中文字寬）
  const COL_W    = 40 - INDENT.length;  // 可用寬度 38
  const SEP = INDENT + '-'.repeat(COL_W) + LF;  // 縮排後 38 條線

  const ITEMS_PER_PAGE      = 13;  // 每張最多品項數
  // 每行品項後加一空白間距（最後一行不加）→ 12個間距
  const ITEM_SPACERS        = ITEMS_PER_PAGE - 1; // 12
  const ITEM_ROW_TOTAL      = ITEMS_PER_PAGE + ITEM_SPACERS; // 25（固定）
  const LINE_SPACING_N      = 47;  // ESC 3 n（最大安全值=47）
  // v2.4校正：C=3.87, T=3.61
  // v2.8：ITEM_ROW_TOTAL=25, contentLines=13+25=38
  //   38×3.87=147mm > 143mm → PAPER_TARGET=151, trail=1 → ~151mm
  const PAPER_TARGET_MM  = 151;   // v2.8：每行間距後最小可達紙張長度
  const C_MM             = 3.87;  // 有內容行推紙 mm
  const T_MM             = 3.61;  // 空白 LF 推紙 mm
  const FIXED_LINES      = 13;    // 標題9行＋頁尾4行

  const items = o.items || [];
  const numPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));

  // ── 先算好每項價格與總計 ──
  let total = 0;
  const priceMap = {};
  const prices = items.map((it, i) => {
    const priceEl = document.getElementById('price_' + i);
    const price = parseFloat(priceEl ? priceEl.value : 0) || 0;
    const qty = Number(it.qty) || 0;
    total += price * qty;
    if (price > 0) priceMap[it.name || ''] = String(price);
    return price;
  });

  // ── 逐頁組字串，全部串接成一次列印 ──
  let fullStr = '';

  for (let page = 0; page < numPages; page++) {
    const startIdx    = page * ITEMS_PER_PAGE;
    const endIdx      = Math.min(startIdx + ITEMS_PER_PAGE, items.length);
    const pageItemCnt = endIdx - startIdx;   // 本頁實際品項數
    const isLast      = (page === numPages - 1);
    const pageTag     = numPages > 1 ? '(' + (page + 1) + '/' + numPages + ')' : '';

    let r = ESC + '@';                                          // 初始化印表機
    r += ESC + '3' + String.fromCharCode(LINE_SPACING_N);      // 設定行距

    // ── 標題區（9行，含3行間距）──
    r += ESC + 'a\x01';       // 置中
    r += ESC + 'E\x01';       // 粗體
    r += ESC + '!\x10';       // 雙倍高度（合豐行專用）
    r += '合豐行';
    r += ESC + '!\x00';       // 恢復正常大小
    r += pageTag + LF;                                                    // 行1
    r += ESC + 'E\x00';       // 取消粗體
    r += ESC + 'a\x00';       // 靠左
    r += INDENT + LF;                                                     // 行2 [間距]
    r += INDENT + '出貨日期：' + (o.deliveryDate || '') + LF;            // 行3
    r += INDENT + '客戶：' + (o.customer || '') + LF;                    // 行4
    r += INDENT + LF;                                                     // 行5 [間距]
    r += SEP;                                                             // 行6
    r += INDENT + padR('品名', 18) + padL('數量', 6) + padL('單價', 7) + padL('小計', 7) + LF;  // 行7
    r += INDENT + LF;                                                     // 行8 [間距]
    r += SEP;                                                             // 行9

    // ── 品項區：每行品項後加一空白行（最後一行不加），均勻間距 ──
    let itemSecLines = 0;
    for (let i = startIdx; i < endIdx; i++) {
      const it     = items[i];
      const price  = prices[i];
      const qty    = Number(it.qty) || 0;
      const sub    = price * qty;
      const qtyStr = qty + (it.unit || '');
      r += INDENT + padR(it.name || '', 18) + padL(qtyStr, 6) + padL(String(price), 7) + padL(String(sub), 7) + LF;
      itemSecLines++;
      // 每行品項後加間距，最後一行品項前（頁尾前）不加
      if (i < endIdx - 1) {
        r += INDENT + LF;
        itemSecLines++;
      }
    }
    // 補空白行至固定 ITEM_ROW_TOTAL，確保各頁等長格式相同
    for (let j = itemSecLines; j < ITEM_ROW_TOTAL; j++) {
      r += INDENT + LF;
    }

    // ── 底部（4行，含2行間距）──
    r += SEP;                                                             // 頁尾行1
    if (isLast) {
      const leftPart  = '經手人：' + handler;
      const rightPart = '合計：$' + total;
      const gap = Math.max(1, COL_W - _clen(leftPart) - _clen(rightPart));
      r += INDENT + leftPart + ' '.repeat(gap) + rightPart + LF;         // 頁尾行2
    } else {
      r += ESC + 'a\x01';
      r += '--- 請翻至下一張 ---' + LF;                                  // 頁尾行2
      r += ESC + 'a\x00';
    }
    r += INDENT + LF;                                                     // 頁尾行3 [間距]
    r += INDENT + LF;                                                     // 頁尾行4 [間距]

    // ── 物理走紙：用實測 C/T 值精確對齊紙張長度 ──
    // trail = round((PAPER_TARGET - contentLines×C) / T)
    // 空白 LF（bare）推紙 T=2.83mm；有字元行推紙 C=4.71mm
    // 品項區固定 ITEM_ROW_TOTAL 行（含間距），contentLines 永遠相同
    const contentLines = FIXED_LINES + ITEM_ROW_TOTAL;
    const pageTRAIL   = Math.max(1, Math.round((PAPER_TARGET_MM - contentLines * C_MM) / T_MM));
    r += LF.repeat(pageTRAIL);
    r += GS + 'V\x42\x00';

    fullStr += r;
  }

  // 轉成 Big5 Uint8Array（臺灣熱感式印表機通常使用 Big5 編碼）
  const bytes = _encodeBig5(fullStr);

  // 記憶橋接器 URL 和經手人
  try { localStorage.setItem('hefeng_bridgeUrl', bridgeUrl); } catch(e) {}
  try { if (handler) localStorage.setItem('hefeng_handler', handler); } catch(e) {}

  fetch(bridgeUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream' },
    body: bytes
  })
  .then(res => {
    if (res.ok) {
      // ★ 列印成功 → 把批價與合計存回這筆訂單（GAS 第9欄）
      savePrintPricesToOrder(printOrderIdx, priceMap, total);
      const msg = numPages > 1 ? '✅ 已送出列印！（共 ' + numPages + ' 張）' : '✅ 已送出列印！';
      alert(msg);
      closePrint();
      // 重新渲染卡片以顯示批價合計
      renderOrders(currentOrders, document.getElementById('dateInput') ? document.getElementById('dateInput').value : '');
    } else {
      res.text().then(t => alert('列印失敗：' + t));
    }
  })
  .catch(err => alert('連線失敗，請確認橋接器已啟動。\n\n' + err));
}

function showStats() {
  const activeOrders = currentOrders.filter(o => o.status !== 'cancelled');
  if (!activeOrders.length) {
    document.getElementById('statsBody').innerHTML = '<div class="empty">這天目前還沒有有效訂單</div>';
    document.getElementById('statsOverlay').classList.add('open');
    return;
  }
  // 加總：key = "品項名稱|單位"
  const totals = {};
  activeOrders.forEach(o => {
    (o.items || []).forEach(it => {
      const key = (it.name || '') + '|' + (it.unit || '');
      if (!totals[key]) totals[key] = { name: it.name || '', unit: it.unit || '', qty: 0 };
      totals[key].qty += Number(it.qty) || 0;
    });
  });
  const rows = Object.values(totals).sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  let html = '<table class="stats-table"><thead><tr><th>品項</th><th>單位</th><th>總計</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr><td>' + escapeHtml(r.name) + '</td><td>' + escapeHtml(r.unit) + '</td><td>' + r.qty + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('statsBody').innerHTML = html;
  document.getElementById('statsOverlay').classList.add('open');
}

function showOverview() {
  document.getElementById('overviewBody').innerHTML = '<div class="overview-loading">載入中…</div>';
  document.getElementById('overviewOverlay').classList.add('open');

  fetch(V2_GAS_URL + '?action=dashboard&pwd=' + encodeURIComponent(pwd))
    .then(r => r.json())
    .then(data => {
      if (data.error) { document.getElementById('overviewBody').innerHTML = '<div class="overview-loading" style="color:#c0392b;">載入失敗：' + data.error + '</div>'; return; }
      const orders = data.orders || [];

      // 依送貨日期分組
      const dateMap = {};
      orders.forEach(o => {
        const d = o.deliveryDate || '（未知）';
        if (!dateMap[d]) dateMap[d] = { active: 0, cancelled: 0 };
        if (o.status === 'cancelled') dateMap[d].cancelled++;
        else dateMap[d].active++;
      });

      const dates = Object.keys(dateMap).sort();
      if (!dates.length) {
        document.getElementById('overviewBody').innerHTML = '<div class="overview-loading">目前沒有任何訂單紀錄</div>';
        return;
      }

      let totalActive = 0, totalCancelled = 0;
      let rows = '';
      dates.forEach(d => {
        const a = dateMap[d].active, c = dateMap[d].cancelled;
        totalActive += a; totalCancelled += c;
        rows += '<tr onclick="jumpToDate(\'' + d + '\')">' +
          '<td>' + d + '</td>' +
          '<td class="tag-active">' + a + '</td>' +
          '<td class="tag-cancelled">' + (c || '—') + '</td>' +
          '<td>' + (a + c) + '</td>' +
        '</tr>';
      });
      rows += '<tr>' +
        '<td>合計</td>' +
        '<td class="tag-active">' + totalActive + '</td>' +
        '<td class="tag-cancelled">' + (totalCancelled || '—') + '</td>' +
        '<td>' + (totalActive + totalCancelled) + '</td>' +
      '</tr>';

      document.getElementById('overviewBody').innerHTML =
        '<p style="font-size:12px;color:#888;margin:0 0 10px;">點選任一列可切換到該日</p>' +
        '<table class="overview-table">' +
          '<thead><tr><th>送貨日期</th><th>有效</th><th>已取消</th><th>合計</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    })
    .catch(() => { document.getElementById('overviewBody').innerHTML = '<div class="overview-loading" style="color:#c0392b;">連線失敗，請檢查網路</div>'; });
}

function submitDeleteDay() {

  const selectedDate = document.getElementById('deldayDate').value;
  const msgEl = document.getElementById('deldayMsg');
  if (!selectedDate) { msgEl.style.color = '#c0392b'; msgEl.textContent = '請先選擇日期'; return; }
  if (!inputPwd) { msgEl.style.color = '#c0392b'; msgEl.textContent = '請輸入密碼'; return; }
  if (inputPwd !== pwd) { msgEl.style.color = '#c0392b'; msgEl.textContent = '密碼錯誤'; return; }

  // 如果選的日期就是目前已載入的日期，直接用 currentOrders；否則先查詢
  const isSameDate = selectedDate === document.getElementById('dateInput').value;
  const ids = isSameDate ? currentOrders.map(o => o.orderId) : null;

  msgEl.style.color = '#555'; msgEl.textContent = '查詢中…';

  const doDelete = (idsToDelete) => {
    if (!idsToDelete.length) { msgEl.style.color = '#888'; msgEl.textContent = '這天沒有任何訂單'; return; }
    msgEl.textContent = '刪除中…';

    fetch(V2_GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'deleteBatch', ids: idsToDelete, pwd: pwd })
    })
    .then(r => r.json())
    .then(result => {
      if (result.error) { msgEl.style.color = '#c0392b'; msgEl.textContent = '刪除失敗：' + result.error; return; }
      closeDeleteDay();
      loadDashboard(selectedDate);
    })
    .catch(() => { msgEl.style.color = '#c0392b'; msgEl.textContent = '連線失敗，請檢查網路'; });
  };

  if (ids) {
    doDelete(ids);
  } else {
    // 選的是其他日期，先查詢該日訂單
    fetch(V2_GAS_URL + '?action=dashboard&date=' + encodeURIComponent(selectedDate) + '&pwd=' + encodeURIComponent(pwd))
      .then(r => r.json())
      .then(data => {
        if (data.error) { msgEl.style.color = '#c0392b'; msgEl.textContent = '查詢失敗：' + data.error; return; }
        doDelete((data.orders || []).map(o => o.orderId));
      })
      .catch(() => { msgEl.style.color = '#c0392b'; msgEl.textContent = '連線失敗，請檢查網路'; });
  }
}

function showChangePwd() {
  document.getElementById('pwdOld').value = '';
  document.getElementById('pwdNew').value = '';
  document.getElementById('pwdConfirm').value = '';
  document.getElementById('pwdMsg').textContent = '';
  document.getElementById('pwdMsg').style.color = '#333';
  document.getElementById('pwdOverlay').classList.add('open');
  setTimeout(() => document.getElementById('pwdOld').focus(), 100);
}

function closeChangePwd() {
  document.getElementById('pwdOverlay').classList.remove('open');
}

function submitChangePwd() {
  const oldPwd = document.getElementById('pwdOld').value.trim();
  const newPwd = document.getElementById('pwdNew').value.trim();
  const confirm = document.getElementById('pwdConfirm').value.trim();
  const msgEl = document.getElementById('pwdMsg');

  if (!oldPwd || !newPwd || !confirm) {
    msgEl.style.color = '#c0392b'; msgEl.textContent = '請填寫所有欄位'; return;
  }
  if (oldPwd !== pwd) {
    msgEl.style.color = '#c0392b'; msgEl.textContent = '目前密碼錯誤'; return;
  }
  if (newPwd.length < 4) {
    msgEl.style.color = '#c0392b'; msgEl.textContent = '新密碼至少需要 4 個字元'; return;
  }
  if (newPwd !== confirm) {
    msgEl.style.color = '#c0392b'; msgEl.textContent = '兩次新密碼不一致'; return;
  }

  msgEl.style.color = '#555'; msgEl.textContent = '送出中…';

  fetch(V2_GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'changePassword', oldPwd: oldPwd, newPwd: newPwd })
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      pwd = newPwd;
      sessionStorage.setItem('hefeng_dashboard_pwd', newPwd);
      msgEl.style.color = '#1e8c3a'; msgEl.textContent = '✅ 密碼已成功修改！';
      setTimeout(() => closeChangePwd(), 1500);
    } else {
      msgEl.style.color = '#c0392b';
      msgEl.textContent = data.error || '修改失敗，請再試一次';
    }
  })
  .catch(() => {
    msgEl.style.color = '#c0392b'; msgEl.textContent = '連線失敗，請檢查網路';
  });
}

if (pwd) loadDashboard(); else renderLogin();
</script>

</html>
